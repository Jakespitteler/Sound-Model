<section class="map-panel" aria-label="Noise map">
  <div class="map-toolbar">
    <div>
      <strong id="mode-label">Pan to explore · drag markers to move</strong>
      <span id="calculation-status" class="toolbar-status" role="status">Add a source to begin</span>
    </div>
    <button id="cancel-mode" hidden class="text-button" type="button">Cancel placement</button>
    <a class="about-link" href="/about" target="_blank" rel="noopener">About</a>
    <button id="home" class="secondary compact" type="button">Greenbushes mine</button>
  </div>
  <div class="location-bar map-navigation">
  <div id="address-search" class="address-search">
    <form id="address-form" role="search" aria-label="Find a location">
      <div class="address-input">
      <input id="address-query" type="text" role="combobox" aria-label="Address or place" placeholder="Address or place"
        aria-autocomplete="list" aria-controls="address-results" aria-expanded="false" aria-describedby="address-status"
        autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="160">
      <button id="clear-address" class="address-clear" type="button" aria-label="Clear address" title="Clear address" hidden>×</button>
      </div>
      <button class="secondary compact" type="submit" aria-label="Search address">Search</button>
    </form>
    <ul id="address-results" role="listbox" aria-label="Address suggestions" hidden></ul>
    <p id="address-status" role="status" aria-live="polite" hidden></p>
    <small id="address-credit" hidden>Search: <a href="https://github.com/komoot/photon" target="_blank" rel="noopener">Photon</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></small>
  </div>
  <details class="coordinate-entry"><summary>Go to coordinates</summary>
  <form id="location-form">
    <label>Latitude<input id="site-lat" type="number" min="-85" max="85" step="any" value="-33.86750" required></label>
    <label>Longitude<input id="site-lng" type="number" min="-180" max="180" step="any" value="116.07647" required></label>
    <button type="submit" class="secondary compact">Go to location</button>
  </form>
  </details>
  </div>
  <div id="map"></div>
  <div id="placement-history" class="placement-history leaflet-bar" role="group" aria-label="Placement history" hidden>
    <button id="undo-placement" type="button" disabled aria-label="Undo" aria-keyshortcuts="Control+Z Meta+Z">↶</button>
    <button id="redo-placement" type="button" disabled aria-label="Redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y">↷</button>
  </div>
  <button id="fit-local-area" class="secondary compact map-fit-button" type="button" disabled title="Fit the area nearest the current map centre">Fit local area</button>
  <details id="sound-key" class="sound-key" open>
    <summary><span class="guide-title">Sound snapshots</span><span class="guide-unit">dB(A)</span></summary>
    <ol id="sound-key-levels"></ol>
  </details>
  <div id="tile-status" class="tile-status" role="status">Loading satellite imagery…</div>
  <button id="contour-alert" class="contour-alert" type="button" hidden aria-controls="contours-panel"></button>

</section>
