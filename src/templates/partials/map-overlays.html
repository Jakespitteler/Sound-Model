<section class="map-panel" aria-label="Noise map">
  <div class="map-toolbar">
    <div>
      <span class="eyebrow">SCENARIO MAP</span>
      <strong id="mode-label">Pan to explore · drag markers to move</strong>
    </div>
    <button id="cancel-mode" hidden class="text-button" type="button">Cancel placement</button>
    <button id="home" class="secondary compact" type="button">Greenbushes</button>
  </div>
  <form id="location-form" class="location-bar">
    <label>Latitude<input id="site-lat" type="number" min="-85" max="85" step="any" value="-33.858" required></label>
    <label>Longitude<input id="site-lng" type="number" min="-180" max="180" step="any" value="116.055" required></label>
    <button type="submit" class="secondary compact">Go to location</button>
  </form>
  <div id="map"></div>
  <div id="tile-status" class="tile-status" role="status">Loading satellite imagery…</div>
  <div class="map-bottom">
    <div class="legend">
      <div class="legend-title">
        <strong>Iso-dB(A) contour lines</strong>
        <label><input id="show-overlay" type="checkbox" checked> Show contours</label>
      </div>
      <div id="contour-legend" class="contour-legend"></div>
      <p>Sources only · excludes background noise</p>
    </div>
    <div class="calculation-status"><span id="calculation-status" role="status">Add a source to begin</span><button id="retry" type="button" class="secondary compact retry" hidden>Retry calculation</button></div>
  </div>
</section>
