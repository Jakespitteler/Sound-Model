<section class="map-panel" aria-label="Noise map">
  <div class="map-toolbar">
    <div>
      <strong id="mode-label">Pan to explore · drag markers to move</strong>
      <span id="calculation-status" class="toolbar-status" role="status">Add a source to begin</span>
    </div>
    <button id="cancel-mode" hidden class="text-button" type="button">Cancel placement</button>
    <a class="about-link" href="/about" target="_blank" rel="noopener">About</a>
    <button id="home" class="secondary compact" type="button">Greenbushes mine</button>
  </div>
  <details class="location-bar"><summary>Go to coordinates</summary>
  <form id="location-form">
    <label>Latitude<input id="site-lat" type="number" min="-85" max="85" step="any" value="-33.86750" required></label>
    <label>Longitude<input id="site-lng" type="number" min="-180" max="180" step="any" value="116.07647" required></label>
    <button type="submit" class="secondary compact">Go to location</button>
  </form>
  </details>
  <div id="map"></div>
  <details id="sound-key" class="sound-key" open>
    <summary><span class="guide-title">Sound snapshots</span><span class="guide-unit">dB(A)</span></summary>
    <ol id="sound-key-levels"></ol>
  </details>
  <div id="tile-status" class="tile-status" role="status">Loading satellite imagery…</div>
  <button id="contour-alert" class="contour-alert" type="button" hidden aria-controls="contours-panel"></button>

</section>
