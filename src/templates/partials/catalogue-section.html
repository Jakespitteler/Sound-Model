<section class="catalogue-section">
  <details class="catalogue-library"><summary>Machine data · <span id="catalogue-count">8 types</span></summary>
  <p class="hint">Starter levels are guesses, not company measurements. <a href="/machine-estimates" target="_blank" rel="noopener">Estimate notes ↗</a></p>
  <p class="hint">Enter sound <strong>power</strong> (LwA), not a pressure reading.</p>
  <div id="types"></div>
  <form id="type-form" class="type-form">
    <label>Machine type<input id="type-name" maxlength="80" required placeholder="e.g. Haul truck"></label>
    <div class="two-columns">
      <label>Sound power · dB(A)<input id="type-level" type="number" min="0" max="300" step="0.1" value="100" required></label>
      <label>Data source
        <select id="type-provenance">
          <option value="example">Example value</option>
          <option value="measured">Measured data</option>
        </select>
      </label>
    </div>
    <label>Source / assumption note<textarea id="type-note" maxlength="2000" rows="2" placeholder="Where did this level come from?"></textarea></label>
    <button class="secondary" type="submit">＋ Add machine type</button>
  </form>
  </details>
</section>
