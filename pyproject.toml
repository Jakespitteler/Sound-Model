[project]
name = "sound-model"
version = "0.1.0"
description = ""
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", ".agents/LICENSE", "src/static/vendor/leaflet/LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "contourpy>=1.4.0",
    "fastapi>=0.162",
    "numpy>=2.5.5",
    "pydantic>=2.14",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16", 
    "pyright>=1.1.414", 
    "pytest>=9.2", 
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
